[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fr3-eef-replay-offline"
version = "0.1.0"
description = "Offline preparation of dual-FR3 EEF replay trajectories"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.scripts]
prepare-eef-replay = "eef_replay.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

